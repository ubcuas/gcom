repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added-large-files
        args: ['--maxkb=500']
    -   id: check-merge-conflict
    -   id: debug-statements
    -   id: check-case-conflict
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
    -   id: ruff
        args: [ --fix ]
    -   id: ruff-format
-   repo: local
    hooks:
    -   id: eslint
        name: eslint
        entry: bash -c 'cd projects/web-frontend && npm run lint'
        language: system
        files: projects/web-frontend/.*\.[jt]sx?$
        pass_filenames: false
    -   id: generate-api-spec
        name: Generate API Spec
        entry: bash -c 'cd projects/web-backend && python3 src/manage.py spectacular --file api_spec.yaml --validate'
        language: system
        files: ^projects/web-backend/
        pass_filenames: false
