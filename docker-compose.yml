services:
  sitl:
    image: ubcuas/uasitl:copter-4.5.0
    platform: linux/amd64
    # Optional for local debugging; CI doesn't need ports published.
    ports:
      - "5760:5760"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 5760)); s.close();\""]
      interval: 5s
      timeout: 3s
      retries: 60

  mavproxy:
    image: python:3.12-slim
    depends_on:
      sitl:
        condition: service_healthy
    volumes:
      - ./projects/integration-tests/mavproxy-entrypoint.sh:/usr/local/bin/mavproxy-entrypoint.sh:ro
    entrypoint: ["/usr/bin/env", "sh", "/usr/local/bin/mavproxy-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/mavproxy.ready"]
      interval: 2s
      timeout: 2s
      retries: 120

  mission-planner:
    build:
      context: ./projects/mission-planner
      dockerfile: Dockerfile
    environment:
      # mission-planner currently hardcodes these defaults, but we set them for
      # future compatibility if main.py is parameterized later.
      - HOST=0.0.0.0
      - PORT=9000
      - MAVLINK_CONNECTION_STRING=udpin:0.0.0.0:14551
      - STATUS_HOST=web-backend
      - STATUS_PORT=8000
    depends_on:
      mavproxy:
        condition: service_healthy
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/', timeout=2).read();\""]
      interval: 5s
      timeout: 3s
      retries: 60

  web-backend:
    build:
      context: ./projects/web-backend
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/src
      - PATH=/root/.local/bin:$PATH
      # If web-backend reads mission-planner URL from env, this makes the whole
      # stack self-contained.
      - MISSION_PLANNER_URL=http://mission-planner:9000
    depends_on:
      - mission-planner
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/drone/status', timeout=2).read();\""]
      interval: 5s
      timeout: 3s
      retries: 60

