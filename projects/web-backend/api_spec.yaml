components:
  schemas:
    ColorEnum:
      enum:
      - black
      - red
      - blue
      - green
      - purple
      - brown
      - orange
      type: string
      description: |-
        * `black` - Black
        * `red` - Red
        * `blue` - Blue
        * `green` - Green
        * `purple` - Purple
        * `brown` - Brown
        * `orange` - Orange
    GroundObject:
      type: object
      description: Serializer to convert GroundObject objects to JSON
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        object_type:
          $ref: '#/components/schemas/ObjectTypeEnum'
        lat:
          type: number
          format: double
        long:
          type: number
          format: double
        shape:
          $ref: '#/components/schemas/ShapeEnum'
        color:
          $ref: '#/components/schemas/ColorEnum'
        text:
          type: string
          maxLength: 100
        text_color:
          $ref: '#/components/schemas/TextColorEnum'
      required:
      - id
      - lat
      - long
      - text
    Image:
      type: object
      description: Serializer to convert Image objects to JSON
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
        title:
          type: string
          maxLength: 100
        image_type:
          $ref: '#/components/schemas/ImageTypeEnum'
        taken_at:
          type: string
          format: date-time
        longitude:
          type: number
          format: double
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        altitude:
          type: number
          format: double
          nullable: true
      required:
      - id
      - image
      - taken_at
      - title
    ImageTypeEnum:
      enum:
      - visible
      - thermal
      type: string
      description: |-
        * `visible` - Visible
        * `thermal` - Thermal
    ObjectTypeEnum:
      enum:
      - standard
      - emergent
      type: string
      description: |-
        * `standard` - Standard
        * `emergent` - Emergent
    OrderedWaypoint:
      type: object
      description: Serializer to convert Waypoint objects to JSON
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 32
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        altitude:
          type: number
          format: double
        radius:
          type: number
          format: double
        pass_radius:
          type: number
          format: double
        pass_option:
          allOf:
          - $ref: '#/components/schemas/PassOptionEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        route:
          type: integer
      required:
      - altitude
      - id
      - latitude
      - longitude
      - name
      - order
      - route
    PassOptionEnum:
      enum:
      - 0
      - 1
      - -1
      type: integer
      description: |-
        * `0` - Passthrough
        * `1` - Orbit Clockwise
        * `-1` - Orbit Counter-Clockwise
    PatchedGroundObject:
      type: object
      description: Serializer to convert GroundObject objects to JSON
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        object_type:
          $ref: '#/components/schemas/ObjectTypeEnum'
        lat:
          type: number
          format: double
        long:
          type: number
          format: double
        shape:
          $ref: '#/components/schemas/ShapeEnum'
        color:
          $ref: '#/components/schemas/ColorEnum'
        text:
          type: string
          maxLength: 100
        text_color:
          $ref: '#/components/schemas/TextColorEnum'
    PatchedImage:
      type: object
      description: Serializer to convert Image objects to JSON
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
        title:
          type: string
          maxLength: 100
        image_type:
          $ref: '#/components/schemas/ImageTypeEnum'
        taken_at:
          type: string
          format: date-time
        longitude:
          type: number
          format: double
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        altitude:
          type: number
          format: double
          nullable: true
    PatchedOrderedWaypoint:
      type: object
      description: Serializer to convert Waypoint objects to JSON
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 32
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        altitude:
          type: number
          format: double
        radius:
          type: number
          format: double
        pass_radius:
          type: number
          format: double
        pass_option:
          allOf:
          - $ref: '#/components/schemas/PassOptionEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        route:
          type: integer
    PatchedRoute:
      type: object
      description: Serializer to convert Route objects to JSON
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 32
        waypoints:
          type: array
          items:
            $ref: '#/components/schemas/OrderedWaypoint'
          readOnly: true
    Route:
      type: object
      description: Serializer to convert Route objects to JSON
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 32
        waypoints:
          type: array
          items:
            $ref: '#/components/schemas/OrderedWaypoint'
          readOnly: true
      required:
      - id
      - name
      - waypoints
    ShapeEnum:
      enum:
      - circle
      - semicircle
      - quartercircle
      - triangle
      - rectangle
      - pentagon
      - star
      - cross
      type: string
      description: |-
        * `circle` - Circle
        * `semicircle` - Semi-Circle
        * `quartercircle` - Quarter-Circle
        * `triangle` - Triangle
        * `rectangle` - Rectangle
        * `pentagon` - Pentagon
        * `star` - Star
        * `cross` - Cross
    TextColorEnum:
      enum:
      - black
      - red
      - blue
      - green
      - purple
      - brown
      - orange
      type: string
      description: |-
        * `black` - Black
        * `red` - Red
        * `blue` - Blue
        * `green` - Green
        * `purple` - Purple
        * `brown` - Brown
        * `orange` - Orange
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
