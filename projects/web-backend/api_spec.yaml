  /api/route/{id}/reorder-waypoints/:
    post:
      operationId: route_reorder_waypoints_create
      description: |-
        Action to reorder waypoints in a route
        Args:
            request: The request object - contains the reordered waypoint ids
            pk: The primary key of the route whose waypoints we're reordering
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this route.
        required: true
