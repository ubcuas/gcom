[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
]
ignore = [
    "E501",  # line too long (handled by black/ruff-format)
    "E402",  # imports not at top (common with sys.path manipulation)
    "E722",  # bare except (common in test helpers/waiters)
    "F403",  # star imports
    "F405",  # undefined names from star imports
]
