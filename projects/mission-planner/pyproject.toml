[tool.poetry]
name = "missionplanner-scripts"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "missionplanner_scripts"}]

[tool.poetry.dependencies]
python = "^3.9"
flask = "^2.2.2"
wsgiserver = "^1.3"
shapely = "^2.0.1"
matplotlib = "^3.7.1"
pytest = "^7.4.2"
flask-socketio = "^5.3.6"
gevent = "^23.9.1"
gevent-websocket = "^0.10.1"
requests = "^2.31.0"
python-socketio = {extras = ["client"], version = "^5.11.2"}
pymavlink = "^2.4.41"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
]
ignore = [
    "E501",  # line too long (handled by black/ruff-format)
    "E402",  # imports not at top (common with sys.path manipulation)
    "E722",  # bare except (common in test helpers/waiters)
    "F403",  # star imports
    "F405",  # undefined names from star imports
]
