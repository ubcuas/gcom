services:
  # ArduCopter SITL with ARM64 support
  sitl:
    image: ubcuas/uasitl:copter-4.5.5
    container_name: acom-sitl
    ports:
      - "5760:5760"
    environment:
      - SITL_BAUDRATE=115200
    restart: unless-stopped
    networks:
      - gcom-network
    healthcheck:
      disable: true
      test: ["CMD", "nc", "-z", "localhost", "5760"]

  # Mavproxy - Communication Hub
  mavproxy:
    image: python:3.12-slim
    container_name: acom-mavproxy
#    depends_on:
#      sitl:
#        condition: service_healthy
    command: >
      bash -c "
      pip install mavproxy pymavlink future &&
      mavproxy.py --master=tcp:sitl:5760 --out=udp:mission-planner:14550 --out=udp:mission-planner:14551
      "
    ports:
      # UDP inputs/outputs for external connections
      - "14550:14550/udp"
      - "14552:14552/udp"
    networks:
      - gcom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "14550"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Mission Planner Server (MPS)
  mission-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mission-planner-mps
    depends_on:
      mavproxy:
        condition: service_healthy
    ports:
      # Mission Planner HTTP server
      - "9000:9000"
      # Status WebSocket
      - "8000:8000"
    environment:
      # Mavproxy configuration - connect to mavproxy container
      - MAVLINK_MASTER=udp:mavproxy:14551
      # These are internal to the container, not used when connecting to mavproxy
      - MAVLINK_OUT_1=udp:127.0.0.1:14551
      - MAVLINK_OUT_2=udp:127.0.0.1:14552

      # Mission Planner Server configuration
      - MPS_HOST=0.0.0.0
      - MPS_PORT=9000
      # - MPS_DEV=true  # Uncomment for development mode
      - MPS_STATUS_HOST=0.0.0.0
      - MPS_STATUS_PORT=8000
      # - DISABLE_STATUS=true  # Uncomment to disable status websocket
    restart: unless-stopped
    networks:
      - gcom-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  gcom-network:
    driver: bridge

